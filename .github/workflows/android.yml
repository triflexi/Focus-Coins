name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.ANDROID_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production API URL
        run: |
          [[ "$EXPO_PUBLIC_API_URL" == https://*"/api/v1" ]] || { echo 'Set ANDROID_API_URL to https://your-domain/api/v1'; exit 2; }
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build -w @focus/core && npm run typecheck -w @focus/mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK from GitHub Secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$EXPO_PUBLIC_API_URL" && test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          buildtools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$buildtools/zipalign" -p -f 4 apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$buildtools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out focus-coins.apk "$RUNNER_TEMP/aligned.apk"
          "$buildtools/apksigner" verify --verbose focus-coins.apk
          sha256sum focus-coins.apk > focus-coins.apk.sha256
      - uses: actions/upload-artifact@v4
        with: {name: android-apk, path: "focus-coins.apk*", retention-days: 90}
      - if: startsWith(github.ref, 'refs/tags/')
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh release create "$GITHUB_REF_NAME" focus-coins.apk focus-coins.apk.sha256 --title "Focus Coins Android $GITHUB_REF_NAME" --generate-notes
