name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: focus
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: focus_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U focus -d focus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://focus:test-password@localhost:5432/focus_test
      TEST_DATABASE_URL: postgresql://focus:test-password@localhost:5432/focus_test
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build applications
        run: npm run build
      - name: Test
        run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: test-results, retention-days: 90}
