groups:
  - name: focus-coins
    rules:
      - alert: ApiUnavailable
        expr: up{job="api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Focus Coins API unavailable"}
      - alert: WebsiteUnavailable
        expr: probe_success{job="blackbox"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Website or readiness probe failed"}
      - alert: DiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.1
        for: 5m
        annotations: {summary: "Less than 10 percent free disk"}
