name: focus-coins
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-focus}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: ${API_IMAGE:?Set immutable API_IMAGE digest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-focus}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: ${WEB_IMAGE:?Set immutable WEB_IMAGE digest}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  proxy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [web, grafana]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.6.0
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    volumes: ["grafana-data:/var/lib/grafana", "./infra/monitoring/grafana:/etc/grafana/provisioning:ro", "./infra/monitoring/dashboards:/var/lib/grafana/dashboards:ro"]
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    pid: host
    restart: unless-stopped
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command: ["--disable_metrics=disk"]
    privileged: true
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker:/var/lib/docker:ro", "/dev/disk:/dev/disk:ro"]
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    volumes: ["./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    restart: unless-stopped
  backups:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-focus}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-focus}
    volumes: ["./backups:/backups", "./scripts/backup-cron.sh:/usr/local/bin/backup-cron.sh:ro"]
    entrypoint: ["sh", "-c", "echo '0 3 * * * sh /usr/local/bin/backup-cron.sh' > /etc/crontabs/root; crond -f -l 2"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  grafana-data:
  prometheus-data:
  caddy-data:
  caddy-config:
