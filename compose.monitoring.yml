services:
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./infra/monitoring/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro", "./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [monitoring]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: ["grafana-data:/var/lib/grafana", "./infra/monitoring/grafana:/etc/grafana/provisioning:ro", "./infra/monitoring/dashboards:/var/lib/grafana/dashboards:ro"]
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    profiles: [monitoring]
    volumes: ["./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    restart: unless-stopped
volumes:
  grafana-data:
  prometheus-data:
